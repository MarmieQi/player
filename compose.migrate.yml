# One-shot migration. The old MySQL container must still be running.
# The tool is a separate image under the existing public backend package.
# Supply the OLD .env; credentials are never passed as command arguments.
services:
  config-migrate:
    image: ghcr.io/marmieqi/player-backend:config-migrate-${IMAGE_TAG:?请指定本次 SQLite 版本的完整提交 SHA}
    environment:
      PLAYER_LOGS_ZONE_ID: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-player_stats}
      MYSQL_USER: ${MYSQL_USER:-player_stats}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请保留旧 MySQL 密码用于迁移}
      PLAYER_LOGS_LIVE_CACHE_SECONDS: ${PLAYER_LOGS_LIVE_CACHE_SECONDS:-120}
      PLAYER_LOGS_IMPORTER_MAX_FILES_PER_RUN: ${PLAYER_LOGS_IMPORTER_MAX_FILES_PER_RUN:-1000}
      PLAYER_LOGS_XRAY_ANALYSIS_RETAINED_JOBS: ${PLAYER_LOGS_XRAY_ANALYSIS_RETAINED_JOBS:-1}
    command: ["--mysql-address", "${MIGRATION_MYSQL_ADDRESS:-mysql:3306}", "--output", "/data/database/player.db"]
    volumes:
      - type: bind
        source: ${DATA_DIRECTORY:-./docker-data}/database
        target: /data/database
        bind:
          create_host_path: true
networks:
  default:
    external: true
    name: ${MIGRATION_NETWORK:-player_default}
