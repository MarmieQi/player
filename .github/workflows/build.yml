name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/marmieqi/player-backend
  FRONTEND_IMAGE: ghcr.io/marmieqi/player-frontend

jobs:
  go-backend:
    name: Go backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend-go/go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race checks
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/storage ./internal/settings ./internal/importer ./internal/groupchat ./internal/share ./internal/httpapi

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o player-stats-backend ./cmd/player-stats
          if go list -deps ./cmd/player-stats | grep -q 'github.com/go-sql-driver/mysql'; then
            echo 'MySQL driver leaked into the runtime server'
            exit 1
          fi

  frontend-vue:
    name: Vue frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-images:
    name: Docker images
    runs-on: ubuntu-latest
    needs:
      - go-backend
      - frontend-vue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment configuration
        run: |
          python3 scripts/check-compose.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-go
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:main
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-vue
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:main
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
